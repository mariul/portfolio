<style>
/* layout: one A3 portfolio on a desk — spreads turn on a 3D spine; controls sit quietly underneath */
:root{--ink:#2b2b2b;--muted:#5f5a4a;--accent:#c8643c;--chip:rgba(255,255,255,.72);--line:rgba(43,43,43,.14);color-scheme:light;

.single .restart.bcbtn.show{animation:popIn .5s cubic-bezier(.3,1.5,.5,1) .3s both}
.single .restart.bcbtn svg{width:clamp(44px,5vw,72px)!important}
.restart.bcbtn{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.restart.bcbtn span{font-family:var(--display);font-weight:600;font-size:clamp(13px,1.2vw,17px);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.single .restart.bcbtn span{font-size:12px}
@media (prefers-reduced-motion:reduce){.fopen .ffront,.fopen .sheet{animation:none!important}.leaf,.book{transition:none!important}}

/* phone version: scrolling page feed, tap a page to read it zoomed */
html:has(body.m){height:auto;overflow-x:clip}
body.m{height:auto;overflow:visible;overflow-x:clip}
body.m .app{height:auto;display:block;padding-top:0}
body.m .stage,body.m nav.bar,body.m .lens{display:none!important}
body.m header{position:sticky;top:0;z-index:25;min-height:0;padding:calc(10px + env(safe-area-inset-top,0px)) 96px 10px 0;margin:0;background:transparent}
body.m header::before{content:"";position:absolute;top:0;bottom:0;left:calc(-1*max(16px,env(safe-area-inset-left,0px)));right:calc(-1*max(16px,env(safe-area-inset-right,0px)));background:rgba(255,253,246,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:-1;box-shadow:0 1px 0 var(--line)}
body.m h1{font-size:17px;line-height:1.1}
body.m .dl{margin:0 0 0 auto;padding:6px 10px}
body.m .folder{top:calc(4px + env(safe-area-inset-top,0px))}
body.m .fclosed{width:68px}
.mlist{display:grid;gap:22px;padding:14px 0 8px;max-width:1100px;margin:0 auto}
.mhint{margin:0;text-align:center;color:var(--muted);font-size:13px;line-height:1.4}
.mpage{all:unset;scroll-margin-top:84px;position:relative;display:block;background:#fff;box-shadow:0 6px 18px rgba(60,40,20,.2);cursor:zoom-in;-webkit-tap-highlight-color:transparent}
.mpage img{display:block;width:100%;height:auto;aspect-ratio:1680/1188;background:#f4f2ec}
.mpage:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mn{position:absolute;left:8px;top:-15px;font-family:"Londrina Solid",var(--display);color:var(--accent);font-size:24px;line-height:1;text-shadow:0 0 4px #fffdf6,0 0 2px #fffdf6}
.mtap{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.88);box-shadow:0 1px 4px rgba(0,0,0,.18);font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.mtap svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

.mend .restart svg{width:56px!important}

body.m .zwrap{padding:58px 10px 84px}
